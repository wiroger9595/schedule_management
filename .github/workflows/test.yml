name: Server Unit Tests

on:
  push:
    branches: [main]
    paths: ["server/**"]
  pull_request:
    paths: ["server/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      # 只裝單元測試需要的最小集合（不裝 torch/osmnx 等重型套件）
      - name: Install test dependencies
        run: |
          pip install pytest python-dotenv numpy \
            "python-jose[cryptography]" bcrypt passlib \
            sqlmodel psycopg2-binary pgvector arrow \
            fastapi openai instructor huggingface_hub

      # 純邏輯單元測試（不需 DB、不打 AI API）
      # AI 回歸測試（test_ai_regression.py）需要 CEREBRAS_API_KEY，本地跑：
      #   cd server && pytest tests/ -v
      - name: Run unit tests
        run: |
          pytest tests/test_auth.py \
                 tests/test_embedding_normalize.py \
                 tests/test_prompt_builder.py -v
        env:
          JWT_SECRET_KEY: ci-test-only-secret
