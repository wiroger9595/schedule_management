services:
  postgres:
    image: postgres:16-alpine
    container_name: schedule_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schedule_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedule_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schedule_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: schedule_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 7800
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 7800 --reload"
    ports:
      - "7800:7800"
    volumes:
      - ./server:/app

  web:
    image: node:22-alpine
    container_name: schedule_web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "9512:9512"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
